schema_version: 1
profile_id: agentic-skill-authoring
version: 1
description: Profile-aware verification rules for authoring and pressure-testing Harness skills.
scenario_set: examples/pressure-scenarios.yaml
required_scenarios:
  - HSP-701-01
  - HSP-701-02
  - HSP-701-03
  - HSP-701-04
  - HSP-701-05
  - HSP-701-06
  - HSP-701-07
  - HSP-701-08
  - HSP-701-09
  - HSP-701-10
optional_hardening_scenarios:
  - HSP-702-07
  - HSP-702-08
  - HSP-702-09
rigid_requirements:
  - scope_and_authorization
  - identity_binding
  - secret_and_runtime_state_boundaries
  - fresh_evidence_for_completion
  - typed_approval_for_destructive_actions
  - blocked_or_escalated_conflict_handling
profiles:
  - id: production
    strictness: strict
    required_verification: [RED, GREEN, broad]
    exception_policy: no_prose_waiver
  - id: high_risk
    strictness: strict
    required_verification: [RED, GREEN, broad]
    exception_policy: no_prose_waiver
  - id: internal_tool
    strictness: standard
    required_verification: [RED, GREEN]
    broad_verification: risk_based
    exception_policy: machine_readable_only
  - id: course_project
    strictness: standard
    required_verification: [RED, GREEN]
    broad_verification: risk_based
    exception_policy: machine_readable_only
  - id: prototype
    strictness: flexible
    required_verification: [focused_characterization]
    broad_verification: optional_with_reason
    exception_policy: machine_readable_only
  - id: quick_change
    strictness: flexible
    required_verification: [focused_characterization]
    broad_verification: optional_with_reason
    exception_policy: machine_readable_only
  - id: personal
    strictness: flexible
    required_verification: [focused_characterization]
    broad_verification: optional_with_reason
    exception_policy: machine_readable_only
flexibility_rules:
  - id: verification-depth
    rigid: The scenario must run, produce an exit code and result, and retain current evidence.
    flexible: Profiles may choose the verification breadth listed above when the exception contains reason, authority, structured alternative verification, and expires_at or follow_up.
  - id: context-depth
    rigid: Required process skills, boundaries, approvals, and safety references remain loaded.
    flexible: Quick-change profiles may use fewer optional references when the selected scope and context budget are recorded.
  - id: scenario-coverage
    rigid: All ten required scenario IDs remain in the scenario set.
    flexible: Prompt wording and pressure strength may vary by profile, but expected safety behavior and evidence requirements may not be weakened.
runner_contract:
  model_selection: configured_role_reference
  provider_binding: forbidden
  required_record_fields: [model_ref, deployment_ref, config_hash, profile_id, scenario_id, result, evidence_location]
